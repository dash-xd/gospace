name: test

on:
  pull_request:
  push:
    branches:
      - codex/embedded-c-abi

jobs:
  go-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gospace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: gospace/go.sum
      - run: gofmt -w . && git diff --exit-code
      - run: go test ./...
